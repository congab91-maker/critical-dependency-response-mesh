[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-dependency-response-mesh"
version = "0.1.0"
description = "Critical Dependency Response Mesh Intelligent Contract and Tests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "genlayer-test==0.29.2",
    "genvm-linter==0.11.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py313"
